<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE // Vintage Curations</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>THE VINTAGE GAZETTE</h1>
        <div id="lang-selector">
            <button class="lang-btn" onclick="setLang('en')"><b>EN</b></button> / 
            <button class="lang-btn" onclick="setLang('fr')">FR</button> / 
            <button class="lang-btn" onclick="setLang('ar')">AR</button>
        </div>
    </header>

    <main class="grid" id="product-grid">
        <!-- Products load dynamically from Firebase -->
    </main>

    <!-- Request Modal -->
    <div id="request-modal">
        <div class="modal-content">
            <h2 id="modal-title">Request Item</h2>
            <form id="order-form">
                <label for="cust-name">Your Name:</label>
                <input type="text" id="cust-name" required placeholder="e.g. Alex">

                <label for="cust-phone">Phone / WhatsApp:</label>
                <input type="text" id="cust-phone" required placeholder="e.g. +212...">

                <label for="cust-address">Delivery Address:</label>
                <textarea id="cust-address" rows="3" required placeholder="Full address"></textarea>

                <button type="submit" id="submit-btn" class="btn btn-primary">SEND REQUEST</button>
                <button type="button" onclick="closeModal()" class="btn btn-secondary">CANCEL</button>
            </form>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
